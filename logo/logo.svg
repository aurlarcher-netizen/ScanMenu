<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="beamGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1B4D" flood-opacity="0.45"/>
    </filter>
    <clipPath id="card">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
    <clipPath id="paperClip">
      <path d="M300 250 H640 L724 334 V800 H300 Z"/>
    </clipPath>
  </defs>

  <!-- Fond : carré arrondi façon icône macOS -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <!-- Barre de menus stylisée -->
  <rect x="64" y="64" width="896" height="110" fill="#FFFFFF" fill-opacity="0.12" clip-path="url(#card)"/>
  <circle cx="720" cy="119" r="11" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="770" cy="119" r="11" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="806" y="104" width="44" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Document -->
  <g filter="url(#shadow)">
    <path d="M300 250 H640 L724 334 V800 H300 Z" fill="#FFFFFF"/>
  </g>
  <path d="M640 250 V334 H724 Z" fill="#DBEAFE"/>

  <!-- Lignes de texte -->
  <g fill="#CBD5E1">
    <rect x="352" y="330" width="230" height="22" rx="11"/>
    <rect x="352" y="390" width="320" height="22" rx="11"/>
    <rect x="352" y="450" width="290" height="22" rx="11"/>
    <rect x="352" y="510" width="320" height="22" rx="11"/>
    <rect x="352" y="640" width="320" height="22" rx="11" fill-opacity="0.45"/>
    <rect x="352" y="700" width="210" height="22" rx="11" fill-opacity="0.45"/>
  </g>

  <!-- Faisceau de scan -->
  <rect x="300" y="470" width="424" height="110" fill="url(#beamGlow)" clip-path="url(#paperClip)"/>
  <rect x="262" y="572" width="500" height="18" rx="9" fill="#22D3EE"/>
  <rect x="262" y="577" width="500" height="8" rx="4" fill="#ECFEFF"/>

  <!-- Dossier de destination -->
  <g filter="url(#shadow)">
    <path d="M610 700 H690 L718 728 H820 A24 24 0 0 1 844 752 V860 A24 24 0 0 1 820 884 H610 A24 24 0 0 1 586 860 V724 A24 24 0 0 1 610 700 Z" fill="url(#folder)" stroke="#2A4CAE" stroke-width="16"/>
  </g>
  <path d="M715 752 V820 M685 792 L715 822 L745 792" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
